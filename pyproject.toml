[project]
name = "jobbot"
version = "0.1.0"
description = "Recolector de ofertas de TI para Costa Rica y LatAm, con seguimiento de postulaciones"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "docxtpl>=0.20",
    "cryptography>=44",
    "google-auth-oauthlib>=1.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobbot = ["*.sql"]

[project.optional-dependencies]
api = ["fastapi", "uvicorn[standard]"]