name: Recolectar ofertas

on:
  schedule:
    # 12:00 y 23:00 UTC = 6:00 am y 5:00 pm en Costa Rica (UTC-6)
    - cron: "0 12,23 * * *"
  workflow_dispatch: {} 

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        sources:
          - getonboard,dynamitejobs,procomer
          - email_alerts
          - greenhouse
          - smartrecruiters
          - lever,ashby
          - workday
          - workable,bamboohr,breezy,recruitee
          - public_web_0
          - public_web_1
          - public_web_2
          - public_web_3
          - public_web_4
          - public_web_5
          - public_web_6
          - public_web_7
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MAIL_MAX_MESSAGES: ${{ vars.MAIL_MAX_MESSAGES || '50' }}
      MAIL_MAX_SECONDS: ${{ vars.MAIL_MAX_SECONDS || '120' }}
      MAIL_REPROCESS_REVIEW: ${{ vars.MAIL_REPROCESS_REVIEW || 'false' }}
      MAIL_APPLY_SEARCH_FILTERS: ${{ vars.MAIL_APPLY_SEARCH_FILTERS || 'false' }}
      MAIL_UNREAD_ONLY: 'true'
      MAIL_OAUTH_CLIENT_ID: ${{ secrets.MAIL_OAUTH_CLIENT_ID }}
      MAIL_OAUTH_CLIENT_SECRET: ${{ secrets.MAIL_OAUTH_CLIENT_SECRET }}
      GMAIL_TOKEN_KEY: ${{ secrets.GMAIL_TOKEN_KEY }}
    steps:
      - name: Verificar que existe el secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secret DATABASE_URL"
            exit 1
          fi
      - name: Verificar OAuth de Gmail
        if: matrix.sources == 'email_alerts'
        run: |
          missing=0
          for name in MAIL_OAUTH_CLIENT_ID MAIL_OAUTH_CLIENT_SECRET GMAIL_TOKEN_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secret $name. Configúralo en Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "### Gmail no se ejecutó: faltan secrets OAuth" >> "$GITHUB_STEP_SUMMARY"
            echo "Usa los mismos valores del entorno local, incluida GMAIL_TOKEN_KEY. Las otras fuentes se ejecutan por separado." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Instalar lector de páginas con JavaScript
        if: startsWith(matrix.sources, 'public_web_')
        run: |
          pip install -e '.[browser]'
          python -m playwright install --with-deps chromium
      - run: python -m jobbot collect --sources "${{ matrix.sources }}"
