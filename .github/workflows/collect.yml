name: Recolectar ofertas

on:
  schedule:
    # 12:00 y 23:00 UTC = 6:00 am y 5:00 pm en Costa Rica (UTC-6)
    - cron: "0 12,23 * * *"
  workflow_dispatch: {} 

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Verificar que existe el secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secret DATABASE_URL"
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m jobbot collect